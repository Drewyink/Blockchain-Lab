databases:
  - name: echolink-blockchain-db
    plan: free
    region: oregon

services:
  - type: web
    name: echolink-blockchain-platform
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install && npm run build && npx prisma db push && npx tsx prisma/seed.ts
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: echolink-blockchain-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
